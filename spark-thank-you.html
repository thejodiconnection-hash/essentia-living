<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Spark Protocol Guide — Jodi Isaacson</title>
  <meta name="description" content="Download the Spark Protocol guide from Jodi Isaacson." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --green:#3d6b4f; --gold:#c9a84c; --dark:#1a1a1a; --mid:#4a4a4a; --light:#f8f6f2; --white:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; display:grid; place-items:center; padding:32px; font-family:'Inter',sans-serif; color:var(--dark); background:linear-gradient(135deg,#f8f6f2 0%,#e8f0eb 100%); line-height:1.6; }
    main { width:min(720px,100%); padding:56px 42px; background:var(--white); border-radius:14px; box-shadow:0 30px 80px rgba(0,0,0,.12); text-align:center; }
    .eyebrow { margin-bottom:14px; color:var(--gold); font-size:12px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; }
    h1 { margin-bottom:18px; color:var(--green); font-family:'Playfair Display',serif; font-size:clamp(34px,6vw,54px); line-height:1.1; }
    p { max-width:560px; margin:0 auto 26px; color:var(--mid); font-size:18px; font-weight:300; }
    a.button { display:inline-block; margin:8px 0 18px; padding:18px 34px; background:var(--green); color:var(--white); border-radius:5px; text-decoration:none; font-weight:700; }
    a.button:hover { background:#2d5340; }
    .small { margin-top:14px; color:#777; font-size:14px; }
    .home { color:var(--green); font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Free Guide</div>
    <h1>Your Spark Protocol is ready.</h1>
    <p>Thank you for joining me. Download the guide below and start with one simple next step.</p>
    <a class="button" href="/spark-protocol.pdf" download>Download the Spark Protocol PDF</a>
    <p class="small">If the download does not start, <a class="home" href="/spark-protocol.pdf">open the PDF here</a>.</p>
    <p class="small"><a class="home" href="/">Return to JodiIsaacson.com</a></p>
  </main>
</body>
</html>
